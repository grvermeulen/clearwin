[package]
name = "clearwin-core"
description = "Scanning and cleaning engine for ClearWin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
trash = "5"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
