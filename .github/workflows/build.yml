name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build frontend
        run: npm run build

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClearWin-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Every push to main refreshes the "latest" pre-release, so there is always one download link.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest target/release/bundle/nsis/*.exe \
            --prerelease \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .exe below and run it to install or update ClearWin." \
            --target "$GITHUB_SHA"
