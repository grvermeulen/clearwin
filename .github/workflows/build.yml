name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build frontend
        run: npm run build

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Each build gets a higher version (0.1.<run number>) so the in-app updater sees it as newer.
      # Update packages are only signed when the updater key secret has been added to the repository.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          VERSION="0.1.${{ github.run_number }}"
          SIGN=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=true; fi
          echo "{\"version\": \"$VERSION\", \"bundle\": {\"createUpdaterArtifacts\": $SIGN}}" > build-config.json
          npx tauri build --bundles nsis --config build-config.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClearWin-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Every push to main refreshes the "latest" pre-release, so there is always one download link,
      # and writes latest.json there, which installed copies check for updates.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release/bundle/nsis
          EXE=$(ls *.exe | head -n 1)
          FILES=("$EXE")
          if [ -f "$EXE.sig" ]; then
            node -e '
              const fs = require("fs");
              const [exe, version, repo] = process.argv.slice(1);
              fs.writeFileSync("latest.json", JSON.stringify({
                version,
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": {
                  signature: fs.readFileSync(exe + ".sig", "utf8"),
                  url: `https://github.com/${repo}/releases/download/latest/${encodeURIComponent(exe)}`,
                } },
              }, null, 2));
            ' "$EXE" "$VERSION" "$GITHUB_REPOSITORY"
            FILES+=("latest.json")
          fi
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${FILES[@]}" \
            --prerelease \
            --title "Latest build ($VERSION)" \
            --notes "Built from ${GITHUB_SHA::7}. Download the .exe below and run it to install ClearWin. Installed copies update themselves." \
            --target "$GITHUB_SHA"
